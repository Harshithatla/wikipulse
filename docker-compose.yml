# WikiPulse local runtime: Kafka (KRaft) + producer + Spark Structured Streaming + Airflow.
# Cloud side (GCS + BigQuery + IAM) is provisioned by Terraform in ./terraform.
name: wikipulse

x-common-env: &common-env
  KAFKA_BOOTSTRAP: kafka:9092
  RAW_TOPIC: wiki.recentchange.raw
  DLQ_TOPIC: wiki.recentchange.dlq
  ALERTS_TOPIC: wiki.alerts
  LAKE_PATH: /lake

services:
  kafka:
    image: apache/kafka:4.0.0
    hostname: kafka
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes: [kafka_data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:4.0.0
    depends_on: { kafka: { condition: service_healthy } }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        k=/opt/kafka/bin/kafka-topics.sh
        b="--bootstrap-server kafka:9092 --if-not-exists"
        $$k $$b --create --topic wiki.recentchange.raw --partitions 6 --replication-factor 1 \
          --config retention.ms=172800000 --config compression.type=producer
        $$k $$b --create --topic wiki.recentchange.dlq --partitions 1 --replication-factor 1 \
          --config retention.ms=604800000
        # Compacted: keeps the latest alert per page (key = wiki:title).
        $$k $$b --create --topic wiki.alerts --partitions 3 --replication-factor 1 \
          --config cleanup.policy=compact --config min.cleanable.dirty.ratio=0.1 --config segment.ms=3600000
        $$k --bootstrap-server kafka:9092 --list
    restart: "no"

  volume-init:
    image: busybox:1.37
    command: ["sh", "-c", "mkdir -p /lake /ivy /airflow-db && chown -R 50000:0 /lake /ivy /airflow-db"]
    volumes: [lake:/lake, ivy:/ivy, airflow_db:/airflow-db]
    restart: "no"

  producer:
    build: ./producer
    depends_on: { kafka-init: { condition: service_completed_successfully } }
    environment:
      <<: *common-env
      WIKIPULSE_SOURCE: ${WIKIPULSE_SOURCE:-synthetic}
      WIKI_ALLOWLIST: ${WIKI_ALLOWLIST:-}
      WIKIPULSE_CONTACT: ${WIKIPULSE_CONTACT:-}
      SYNTHETIC_RATE: ${SYNTHETIC_RATE:-50}
      SYNTHETIC_STORM_EVERY: ${SYNTHETIC_STORM_EVERY:-6000}
    volumes: [producer_state:/state]
    restart: unless-stopped

  spark:
    build: ./streaming
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      volume-init: { condition: service_completed_successfully }
    environment:
      <<: *common-env
      TRIGGER_SECONDS: ${TRIGGER_SECONDS:-60}
      STORM_MIN_EDITS: ${STORM_MIN_EDITS:-15}
      STORM_MIN_EDITORS: ${STORM_MIN_EDITORS:-5}
    ports: ["4040:4040"] # Spark UI (Structured Streaming tab)
    volumes: [lake:/lake, ivy:/opt/ivy]
    restart: unless-stopped

  airflow:
    build: ./airflow
    depends_on: { volume-init: { condition: service_completed_successfully } }
    command: standalone
    ports: ["8080:8080"]
    environment:
      LAKE_PATH: /lake
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True" # local dev only
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/db/airflow.db
      AIRFLOW_CONN_GOOGLE_CLOUD_DEFAULT: >-
        {"conn_type": "google_cloud_platform",
         "extra": {"key_path": "/opt/airflow/secrets/sa.json", "project": "${WIKIPULSE_GCP_PROJECT:-}"}}
      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/secrets/sa.json
      WIKIPULSE_GCP_PROJECT: ${WIKIPULSE_GCP_PROJECT:-}
      WIKIPULSE_BUCKET: ${WIKIPULSE_BUCKET:-}
      WIKIPULSE_BQ_LOCATION: ${WIKIPULSE_BQ_LOCATION:-us-central1}
      WIKIPULSE_START: ${WIKIPULSE_START:-2026-01-01T00:00:00}
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/include:/opt/airflow/include:ro
      - ./secrets:/opt/airflow/secrets:ro
      - lake:/lake
      - airflow_db:/opt/airflow/db
    restart: unless-stopped

  kafka-ui:
    profiles: ["ui"]
    image: ghcr.io/kafbat/kafka-ui:latest
    ports: ["8081:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: wikipulse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on: { kafka: { condition: service_healthy } }

volumes:
  kafka_data:
  lake:
  ivy:
  producer_state:
  airflow_db:
