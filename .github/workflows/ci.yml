name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: unit + spark + contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q tests --ignore=tests/test_dags.py

  airflow:
    name: DAG integrity (Airflow 3.1.8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install "apache-airflow==3.1.8" apache-airflow-providers-google duckdb pytest \
            --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.1.8/constraints-3.12.txt
      - run: airflow db migrate
        env: { AIRFLOW_HOME: /tmp/airflow }
      - run: pytest -q tests/test_dags.py
        env: { AIRFLOW_HOME: /tmp/airflow }

  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: terraform }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config --quiet
